name: Deploy Landing Pages

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        page: [offmarket, buybefore, quiet, relaunch, brightflip, finaloffer, invest, seniors]
    steps:
      - uses: actions/checkout@v4

      - name: Deploy ${{ matrix.page }}
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: .
          command: deploy --config ${{ matrix.page }}/wrangler.toml
        env:
          WRANGLER_LOG: debug
